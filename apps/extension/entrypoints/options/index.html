<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>Klipstack</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			/* Matches the web app's paper, navy, and charcoal palette. */
			:root {
				color-scheme: light;
				--bg: #fbfaf7;
				--fg: #1a1d23;
				--muted-fg: #5f646b;
				--card: #fff;
				--border: #dfded9;
				--accent: #243f6c;
				--accent-fg: #fcfcfc;
				--ring: #3070c7;
				--success: #15803d;
			}
			@media (prefers-color-scheme: dark) {
				:root {
					color-scheme: dark;
					--bg: #111419;
					--fg: #e9e8e3;
					--muted-fg: #999fa8;
					--card: #1a1e25;
					--border: #30353d;
					--accent: #7faee9;
					--accent-fg: #0d141f;
					--ring: #7faee9;
					--success: #86d6a2;
				}
			}
			body {
				font:
					15px/1.5 system-ui,
					sans-serif;
				margin: 0;
				padding: 32px;
				max-width: 520px;
				color: var(--fg);
				background: var(--bg);
			}
			h1 {
				font-size: 20px;
				margin: 0 0 4px;
				color: var(--accent);
			}
			p {
				color: var(--muted-fg);
				margin: 0 0 20px;
			}
			label {
				display: block;
				font-weight: 600;
				margin: 16px 0 6px;
			}
			input {
				width: 100%;
				box-sizing: border-box;
				padding: 8px 10px;
				border: 1px solid var(--border);
				border-radius: 8px;
				font: inherit;
				color: var(--fg);
				background: var(--card);
			}
			input::placeholder {
				color: var(--muted-fg);
				opacity: 1;
			}
			button {
				margin-top: 20px;
				padding: 10px 16px;
				border: 0;
				border-radius: 8px;
				background: var(--accent);
				color: var(--accent-fg);
				font: inherit;
				font-weight: 600;
				cursor: pointer;
			}
			button:hover {
				opacity: 0.9;
			}
			:focus-visible {
				outline: 2px solid var(--ring);
				outline-offset: 2px;
			}
			#status {
				margin-left: 12px;
				color: var(--success);
			}
			small {
				color: var(--muted-fg);
			}
		</style>
	</head>
	<body>
		<h1 data-i18n="name">Klipstack</h1>
		<p data-i18n="optionsIntro">
			The extension saves to the Klipstack account you are signed in to in this browser.
		</p>
		<form id="form">
			<label for="appUrl" data-i18n="optionsAppUrl">Klipstack address</label>
			<input id="appUrl" name="appUrl" type="url" required placeholder="https://klipstack.app" />
			<small data-i18n="optionsAppUrlHint"
				>Change it only if you run your own Klipstack server.</small
			>
			<div>
				<button type="submit" data-i18n="optionsSave">Save</button>
				<span id="status" role="status"></span>
			</div>
		</form>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
