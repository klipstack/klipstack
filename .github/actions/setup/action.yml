name: Set up the workspace
description: Install pnpm, Node and the workspace dependencies. Needs the repository checked out.

inputs:
  filter:
    description: The workspaces to install, as pnpm's --filter.
    # Not the mobile app: Expo and React Native double the install, and only the `mobile` job in
    # ci.yml reads it. That job installs the app and the packages it uses instead.
    default: "!@klipstack/mobile"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version-file: .nvmrc
        cache: pnpm
    - run: pnpm install --frozen-lockfile --filter "$FILTER"
      shell: bash
      env:
        FILTER: ${{ inputs.filter }}
