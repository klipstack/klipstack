packages:
  - apps/*
  - packages/*
# Resolve only versions published at least 7 days ago (in minutes): most compromised releases are
# found and pulled within days. To take an urgent security fix sooner, list the package below.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  # GHSA-27r3-jxmh-p828 (published 2026-10-22). Remove once 2.4.0 is a week old (2026-10-29).
  - body-parser@2.4.0
overrides:
  "@esbuild-kit/core-utils>esbuild": "0.25.12"
  "@jimp/core>phin": "3.7.1"
  # Mobile prebuild tooling (Xcode project and plist editing) pins old, advised versions.
  "@expo/plist@0.0.18>@xmldom/xmldom": "^0.8.15"
  "@bacons/xcode>uuid": "^11.1.1"
  "xcode>uuid": "^11.1.1"
auditConfig:
  ignoreGhsas:
    # decode-uri-component through expo-router's query-string: a slow decode of malformed links
    # inside the user's own app. The fixed version is ESM-only, which query-string 7 cannot require.
    - GHSA-vcc3-ghjq-m6fr
    # node-forge through @expo/cli: forged RSA signatures pass verification. The Expo CLI runs on
    # the developer's machine and never ships; no fixed version exists yet.
    - GHSA-86w9-cpqp-85rv
    # braces through @expo/cli's file map: a deeply nested glob exhausts the stack. Only Metro's
    # own patterns reach it, on the developer's machine; it never ships. No fixed version exists.
    - GHSA-vfj7-8cjw-p6xm
    # postcss-selector-parser through @tailwindcss/typography, which pins 6.0.10 even in its latest
    # release: a quadratic parse of a long flat selector. Only our own CSS reaches it, at build time.
    - GHSA-rj75-hqrm-r3gf
    # zod 3 through @expo/cli: a huge array that fails validation exhausts memory. Our own zod is
    # 4.6.7, which is fixed; the Expo CLI, even its latest, pins zod 3, for which no fixed version
    # exists. It parses only the developer's own project files, on their machine; it never ships.
    - GHSA-mrhx-c7xc-m3w5
onlyBuiltDependencies:
  - sharp
  - esbuild
  - better-sqlite3
  - wxt
patchedDependencies:
  # The system text menu (Paste) in the reader page's note field: see the patch.
  react-native-webview@13.16.1: patches/react-native-webview@13.16.1.patch
